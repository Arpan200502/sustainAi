# PostgreSQL connection. Override these with environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sustain_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use application-local.properties for credentials during local development.
spring.profiles.active=local
groq.api-key=${GROQ_API_KEY:}

# Keep the API errors readable during this learning project.
server.error.include-message=always

# Run schema.sql against PostgreSQL at startup.
spring.sql.init.mode=always
